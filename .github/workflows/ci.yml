# Integração contínua: roda a suíte de testes (com banco temporário) e confere o build do cliente em Windows, Linux e macOS.
# Primeira execução (2026-11-07) revelou testes que presumiam o Windows e o esbuild do cliente; ajustados. Enquanto isso, o macOS não bloqueia o resultado (continue-on-error).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # alguns testes empacotam código do cliente (esbuild vive nas dependências de client/)
      - run: npm --prefix client ci
      # node-pty no macOS: o helper de spawn pode vir sem permissão de execução do pacote npm
      - name: Permissão do spawn-helper do node-pty (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x node_modules/node-pty/prebuilds/*/spawn-helper 2>/dev/null || true
      - name: Suíte completa com banco temporário (nunca usa data/ do repositório)
        shell: bash
        run: |
          export ORCH_DATA_DIR="$(mktemp -d)"
          npm test

  client-build:
    name: Build do cliente
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm --prefix client ci
      - run: npm --prefix client run build
